<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Tasks Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body{
            min-height:100vh;
            background:linear-gradient(135deg,#0d6efd,#4f46e5,#06b6d4);
            padding:40px 20px;
            font-family:"Segoe UI",sans-serif;
        }

        .task-card{
            background:rgba(255,255,255,0.15);
            backdrop-filter:blur(12px);
            -webkit-backdrop-filter:blur(12px);
            border-radius:20px;
            padding:30px;
            box-shadow:0 8px 30px rgba(0,0,0,0.25);
        }

        .page-title{
            color:white;
            text-align:center;
            font-weight:bold;
            margin-bottom:25px;
        }

        .summary-card{
            background:white;
            padding:20px;
            border-radius:15px;
            text-align:center;
            margin-bottom:25px;
            box-shadow:0 4px 15px rgba(0,0,0,0.15);
        }

        .summary-number{
            font-size:36px;
            font-weight:bold;
            color:#0d6efd;
        }

        .table{
            overflow:hidden;
            border-radius:15px;
            background:white;
            margin-bottom:0;
        }

        .table thead{
            background:linear-gradient(to right,#2563eb,#4338ca);
            color:white;
        }

        .table thead th{
            padding:15px;
            text-align:center;
            border:none;
        }

        .table tbody td{
            text-align:center;
            vertical-align:middle;
            padding:15px;
        }

        .table tbody tr{
            transition:0.3s ease;
        }

        .table tbody tr:hover{
            background:#eef6ff;
        }

        .story-badge{
            background:#0d6efd;
            color:white;
            padding:8px 14px;
            border-radius:20px;
            font-weight:600;
        }

        .hours-badge{
            background:#20c997;
            color:white;
            padding:8px 14px;
            border-radius:20px;
            font-weight:600;
        }

        .test-badge{
            background:#fd7e14;
            color:white;
            padding:8px 14px;
            border-radius:20px;
            font-weight:600;
        }

        .defect-badge{
            background:#dc3545;
            color:white;
            padding:8px 14px;
            border-radius:20px;
            font-weight:600;
        }

        .empty-row{
            text-align:center;
            padding:30px;
            font-size:18px;
            color:#6c757d;
        }

    </style>

</head>

<body>

<div class="container">

    <!-- Navigation Buttons -->

    <div class="d-flex justify-content-between mb-4">

        <a th:href="@{/user}"
           class="btn btn-light">

            <i class="bi bi-arrow-left"></i>
            Back To Dashboard

        </a>

        <a th:href="@{/user/task/new}"
           class="btn btn-primary">

            <i class="bi bi-plus-circle"></i>
            New Task

        </a>

    </div>

    <!-- Main Card -->

    <div class="task-card">

        <h2 class="page-title">

            <i class="bi bi-kanban-fill"></i>

            My Tasks Dashboard

        </h2>

        <!-- Summary -->

        <div class="summary-card">

            <h5>Total Tasks</h5>

            <div class="summary-number"
                 th:text="${tasks != null ? #lists.size(tasks) : 0}">

                0

            </div>

        </div>

        <!-- Table -->

        <div class="table-responsive">

            <table class="table table-hover shadow">

                <thead>

                <tr>

                    <th>
                        <i class="bi bi-bookmark-fill"></i>
                        Story ID
                    </th>

                    <th>
                        <i class="bi bi-clock-fill"></i>
                        Hours Worked
                    </th>

                    <th>
                        <i class="bi bi-check2-square"></i>
                        Test Cases Executed
                    </th>

                    <th>
                        <i class="bi bi-bug-fill"></i>
                        Defects Raised
                    </th>

                </tr>

                </thead>

                <tbody>

                <tr th:each="task : ${tasks}">

                    <td>

                        <span class="story-badge"
                              th:text="${task.storyId}">

                            STORY-001

                        </span>

                    </td>

                    <td>

                        <span class="hours-badge"
                              th:text="${task.hoursWorked}">

                            8

                        </span>

                    </td>

                    <td>

                        <span class="test-badge"
                              th:text="${task.testCasesExecuted}">

                            25

                        </span>

                    </td>

                    <td>

                        <span class="defect-badge"
                              th:text="${task.defectsRaised}">

                            2

                        </span>

                    </td>

                </tr>

                <tr th:if="${tasks == null or #lists.isEmpty(tasks)}">

                    <td colspan="4"
                        class="empty-row">

                        <i class="bi bi-inbox-fill fs-3"></i>

                        <div class="mt-2">

                            No tasks available

                        </div>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>

</html>
