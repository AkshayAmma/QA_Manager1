<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>
        My Productivity Analytics
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{
            background:#f4f7fc;
        }

        .header{
            background:linear-gradient(135deg,#0d6efd,#4f46e5);
            color:white;
            padding:25px;
            border-radius:15px;
            margin-bottom:25px;
        }

        .card{
            border:none;
            border-radius:15px;
            box-shadow:0px 4px 15px rgba(0,0,0,.08);
        }

        .metric-value{
            font-size:34px;
            font-weight:bold;
        }

    </style>

</head>

<body>

<div class="container py-4">

    <div class="header">

        <h2>

            📈 My Productivity Analytics

        </h2>

        <p>

            Personal QA Performance Metrics

        </p>

    </div>

    <div class="mb-4">

        <a th:href="@{/user}"
           class="btn btn-secondary">

            Back To Dashboard

        </a>

    </div>

    <div class="row g-4">

        <div class="col-md-4">

            <div class="card">

                <div class="card-body text-center">

                    <h6>Total Tasks</h6>

                    <div class="metric-value text-primary"
                         th:text="${dashboard.totalTasks}">
                    </div>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card">

                <div class="card-body text-center">

                    <h6>Executed Cases</h6>

                    <div class="metric-value text-success"
                         th:text="${dashboard.executedCases}">
                    </div>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card">

                <div class="card-body text-center">

                    <h6>Defects Raised</h6>

                    <div class="metric-value text-danger"
                         th:text="${dashboard.totalDefects}">
                    </div>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card">

                <div class="card-body text-center">

                    <h6>Hours Logged</h6>

                    <div class="metric-value text-info"
                         th:text="${dashboard.totalHours}">
                    </div>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card">

                <div class="card-body text-center">

                    <h6>Assigned Stories</h6>

                    <div class="metric-value text-warning"
                         th:text="${dashboard.assignedStories}">
                    </div>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card">

                <div class="card-body text-center">

                    <h6>Productivity</h6>

                    <div class="metric-value text-success"
                         th:text="${#numbers.formatDecimal(dashboard.productivity,1,2) + '%'}">
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
