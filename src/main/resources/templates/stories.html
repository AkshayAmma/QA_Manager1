<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Story Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #4f46e5, #0d6efd, #06b6d4);
            font-family: "Segoe UI", sans-serif;
            padding: 40px 0;
        }

        .page-header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .page-header h1 {
            font-weight: 700;
            margin-bottom: 10px;
        }

        .page-header p {
            opacity: 0.9;
            font-size: 16px;
        }

        .main-card {
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.18);
            margin-bottom: 25px;
        }

        .section-title {
            color: #0d6efd;
            font-weight: 700;
            margin-bottom: 25px;
        }

        .form-label {
            font-weight: 600;
            color: #495057;
        }

        .form-control {
            border-radius: 12px;
            padding: 12px;
            border: 1px solid #dbe4ff;
        }

        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 12px rgba(13, 110, 253, 0.25);
        }

        .btn-create {
            background: linear-gradient(45deg, #0d6efd, #2563eb);
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
            color: white;
        }

        .btn-create:hover {
            background: linear-gradient(45deg, #0b5ed7, #1d4ed8);
            color: white;
        }

        .stories-table-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 12px 35px rgba(0,0,0,0.18);
        }

        .table-header {
            background: linear-gradient(45deg, #0d6efd, #2563eb);
            color: white;
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .table-header h5 {
            margin: 0;
            font-weight: 600;
        }

        .search-box {
            max-width: 250px;
        }

        .table {
            margin-bottom: 0;
        }

        .table thead {
            background-color: #f8f9fa;
        }

        .table th {
            font-weight: 600;
            color: #495057;
        }

        .table tbody tr:hover {
            background-color: #f5f9ff;
            transition: 0.3s;
        }

        .action-btn {
            border-radius: 8px;
            padding: 6px 14px;
            font-size: 14px;
        }

        .btn-edit {
            background: #ffc107;
            border: none;
            color: black;
        }

        .btn-delete {
            background: #dc3545;
            border: none;
            color: white;
        }

        .empty-message {
            text-align: center;
            padding: 25px;
            color: gray;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: white;
            opacity: 0.9;
        }

        @media (max-width: 768px) {

            .main-card {
                padding: 25px;
            }

            .table-header {
                flex-direction: column;
                gap: 10px;
            }

            .search-box {
                max-width: 100%;
            }
        }
    </style>

</head>

<body>

<div class="container">

    <!-- Page Header -->

    <div class="page-header">
        <h1>User Story Management</h1>
        <p>Create and manage sprint user stories efficiently</p>
    </div>

    <!-- Create Story Form -->

    <div class="main-card">

        <h4 class="section-title">
            Create User Story
        </h4>

        <form th:action="@{/stories/save}" method="post">

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label class="form-label">Story ID</label>
                    <input type="text"
                           name="storyId"
                           class="form-control"
                           placeholder="US-101"
                           required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Story Name</label>
                    <input type="text"
                           name="storyName"
                           class="form-control"
                           placeholder="Login Functionality"
                           required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Sprint Name</label>
                    <input type="text"
                           name="sprintName"
                           class="form-control"
                           placeholder="Sprint 1"
                           required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Total Test Cases</label>
                    <input type="number"
                           name="totalTestCases"
                           class="form-control"
                           placeholder="50"
                           required>
                </div>

            </div>

            <div class="text-center mt-3">
                <button type="submit"
                        class="btn btn-create w-100">
                    Create User Story
                </button>
            </div>

        </form>

    </div>

    <!-- User Story Table -->

    <div class="stories-table-card">

        <div class="table-header">
            <h5>User Stories</h5>

            <input type="text"
                   class="form-control search-box"
                   placeholder="Search Story">
        </div>

        <div class="table-responsive">

            <table class="table table-hover align-middle">

                <thead>
                <tr>
                    <th>Story ID</th>
                    <th>Story Name</th>
                    <th>Sprint</th>
                    <th>Total Test Cases</th>
                    <th width="180">Actions</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="story : ${stories}">

                    <td th:text="${story.storyId}"></td>

                    <td th:text="${story.storyName}"></td>

                    <td th:text="${story.sprintName}"></td>

                    <td th:text="${story.totalTestCases}"></td>

                    <td>

                        <a th:href="@{/stories/edit/{id}(id=${story.id})}"
                           class="btn btn-sm btn-edit action-btn">
                            Edit
                        </a>

                        <a th:href="@{/stories/delete/{id}(id=${story.id})}"
                           class="btn btn-sm btn-delete action-btn"
                           onclick="return confirm('Are you sure you want to delete this user story?')">
                            Delete
                        </a>

                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(stories)}">
                    <td colspan="5" class="empty-message">
                        No User Stories Available
                    </td>
                </tr>

                </tbody>

            </table>

        </div>

    </div>

    <div class="footer">
        © 2026 QA Task Management System
    </div>

</div>

</body>

</html>
