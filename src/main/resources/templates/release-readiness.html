<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Release Readiness</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{
            background:#f4f7fc;
            font-family:"Segoe UI",sans-serif;
        }

        .header{
            background:linear-gradient(135deg,#0d6efd,#4f46e5);
            color:white;
            padding:25px;
            border-radius:15px;
            margin-bottom:25px;
        }

        .card{
            border:none;
            border-radius:15px;
            box-shadow:0 4px 15px rgba(0,0,0,0.08);
        }

        .card-body{
            padding:25px;
        }

        .metric-title{
            color:#6c757d;
            font-size:14px;
        }

        .metric-value{
            font-size:32px;
            font-weight:bold;
        }

        .ready{
            background:#198754;
            color:white;
            padding:20px;
            border-radius:15px;
            text-align:center;
        }

        .not-ready{
            background:#dc3545;
            color:white;
            padding:20px;
            border-radius:15px;
            text-align:center;
        }

    </style>

</head>

<body>

<div class="container mt-4">

    <div class="header">

        <h2>
            🚀 Release Readiness Dashboard
        </h2>

        <p>
            Release Quality Gate Assessment
        </p>

    </div>

    <div class="row g-4">

        <div class="col-md-3">

            <div class="card">

                <div class="card-body text-center">

                    <div class="metric-title">
                        Coverage %
                    </div>

                    <div class="metric-value"
                         th:text="${#numbers.formatDecimal(release.coverage,1,2)}">
                        0
                    </div>

                </div>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card">

                <div class="card-body text-center">

                    <div class="metric-title">
                        Automation Coverage %
                    </div>

                    <div class="metric-value"
                         th:text="${#numbers.formatDecimal(release.automationCoverage,1,2)}">
                        0
                    </div>

                </div>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card">

                <div class="card-body text-center">

                    <div class="metric-title">
                        Critical Defects
                    </div>

                    <div class="metric-value text-danger"
                         th:text="${release.criticalDefects}">
                        0
                    </div>

                </div>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card">

                <div class="card-body text-center">

                    <div class="metric-title">
                        Production Leakage
                    </div>

                    <div class="metric-value"
                         th:text="${release.productionLeakage}">
                        0
                    </div>

                </div>

            </div>

        </div>

    </div>

    <div class="mt-5">

        <div th:if="${release.releaseStatus == 'READY'}"
             class="ready">

            <h1>✅ RELEASE READY</h1>

            <p>
                All quality gates passed successfully.
            </p>

        </div>

        <div th:if="${release.releaseStatus == 'NOT READY'}"
             class="not-ready">

            <h1>❌ RELEASE NOT READY</h1>

            <p>
                Quality gates are not yet satisfied.
            </p>

        </div>

    </div>

</div>

</body>

</html>
