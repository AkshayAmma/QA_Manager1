<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Task Entry</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <style>

        body{
            min-height:100vh;
            background:linear-gradient(
                    135deg,
                    #4f46e5,
                    #7c3aed);
            display:flex;
            justify-content:center;
            align-items:center;
            padding:20px;
            font-family:"Segoe UI",sans-serif;
        }

        .card{
            width:100%;
            max-width:600px;
            background:#fff;
            padding:35px;
            border-radius:20px;
            box-shadow:0 15px 40px rgba(0,0,0,.15);
        }

        .title{
            text-align:center;
            color:#4f46e5;
            margin-bottom:8px;
        }

        .subtitle{
            text-align:center;
            color:#666;
            margin-bottom:30px;
        }

        .form-group{
            margin-bottom:20px;
        }

        label{
            display:block;
            margin-bottom:8px;
            font-weight:600;
        }

        input{
            width:100%;
            padding:12px;
            border:2px solid #e5e7eb;
            border-radius:10px;
        }

        input:focus{
            border-color:#4f46e5;
            outline:none;
        }

        .btn-save{
            width:100%;
            background:#4f46e5;
            border:none;
            color:white;
            padding:14px;
            border-radius:10px;
            font-weight:600;
        }

        .btn-save:hover{
            background:#4338ca;
        }

    </style>

</head>

<body>

<div class="card">

    <h2 class="title">
        Task Entry
    </h2>

    <p class="subtitle">
        Track your daily work
    </p>

    <form th:action="@{/user/task/save}"
          th:object="${task}"
          method="post">

        <div class="form-group">

            <label>
                Story ID
            </label>

            <input type="text"
                   th:field="*{storyId}"
                   placeholder="Enter Story ID">

        </div>

        <div class="form-group">

            <label>
                Hours Worked
            </label>

            <input type="number"
                   step="0.5"
                   th:field="*{hoursWorked}"
                   placeholder="Hours Worked">

        </div>

        <div class="form-group">

            <label>
                Test Cases Executed
            </label>

            <input type="number"
                   th:field="*{testCasesExecuted}"
                   placeholder="Executed Test Cases">

        </div>

        <div class="form-group">

            <label>
                Defects Raised
            </label>

            <input type="number"
                   th:field="*{defectsRaised}"
                   placeholder="Defects Raised">

        </div>

        <button type="submit"
                class="btn-save">

            Save Task

        </button>

    </form>

</div>

</body>

</html>
