<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced QA KPIs</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {
            background: #f4f7fc;
            font-family: "Segoe UI", sans-serif;
        }

        .dashboard-header {
            background: linear-gradient(135deg, #0d6efd, #4f46e5);
            color: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .stats-card {
            border: none;
            border-radius: 15px;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.08);
            background: white;
        }

        .stats-card:hover {
            transform: translateY(-6px);
            box-shadow: 0px 10px 25px rgba(0,0,0,0.15);
        }

        .card-body {
            padding: 25px;
        }

        .stats-title {
            color: #6c757d;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .stats-value {
            font-size: 32px;
            font-weight: bold;
            color: #212529;
            margin-top: 10px;
        }

        .activity-box {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-top: 25px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.08);
        }

        .table th {
            font-weight: 600;
        }

        @media(max-width:768px) {

            .dashboard-header {
                text-align: center;
            }

            .stats-value {
                font-size: 24px;
            }
        }

    </style>
</head>

<body>

<div class="container-fluid p-4">

    <!-- Page Header -->

    <div class="dashboard-header">

        <div class="d-flex justify-content-between align-items-center">

            <div>
                <h2>📈 Advanced QA KPIs</h2>
                <p class="mb-0">
                    Key quality indicators and defect backlog insights
                </p>
            </div>

            <a th:href="@{/admin}"
               class="btn btn-light">
                Back to Dashboard
            </a>

        </div>

    </div>

    <!-- KPI Metrics -->

    <div class="row g-4">

        <div class="col-md-4">

            <div class="stats-card">

                <div class="card-body">

                    <div class="stats-title">
                        First Pass Rate
                    </div>

                    <div class="stats-value"
                         th:text="${advanced.firstPassRate}">
                        0%
                    </div>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="stats-card">

                <div class="card-body">

                    <div class="stats-title">
                        Defect Escape Rate
                    </div>

                    <div class="stats-value"
                         th:text="${advanced.defectEscapeRate}">
                        0%
                    </div>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="stats-card">

                <div class="card-body">

                    <div class="stats-title">
                        Quality Of Fix
                    </div>

                    <div class="stats-value"
                         th:text="${advanced.qualityOfFix}">
                        0%
                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- Open Defect Backlog -->

    <div class="activity-box">

        <h4 class="mb-4">
            🐞 Open Defect Backlog
        </h4>

        <div class="table-responsive">

            <table class="table table-hover">

                <thead class="table-primary">

                <tr>
                    <th>Severity</th>
                    <th>Open Defects</th>
                </tr>

                </thead>

                <tbody>

                <tr>
                    <td>
                        <span class="badge bg-danger">
                            Critical
                        </span>
                    </td>
                    <td th:text="${advanced.criticalOpen}">
                        0
                    </td>
                </tr>

                <tr>
                    <td>
                        <span class="badge bg-warning text-dark">
                            High
                        </span>
                    </td>
                    <td th:text="${advanced.highOpen}">
                        0
                    </td>
                </tr>

                <tr>
                    <td>
                        <span class="badge bg-info">
                            Medium
                        </span>
                    </td>
                    <td th:text="${advanced.mediumOpen}">
                        0
                    </td>
                </tr>

                <tr>
                    <td>
                        <span class="badge bg-success">
                            Low
                        </span>
                    </td>
                    <td th:text="${advanced.lowOpen}">
                        0
                    </td>
                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
