<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sprint Dashboard</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body{
            background:#f4f7fc;
            font-family:"Segoe UI",sans-serif;
        }

        .header{
            background:linear-gradient(135deg,#0d6efd,#4f46e5);
            color:white;
            padding:25px;
            border-radius:15px;
            margin-bottom:25px;
            box-shadow:0 4px 15px rgba(0,0,0,.1);
        }

        .card{
            border:none;
            border-radius:15px;
            box-shadow:0 4px 15px rgba(0,0,0,.08);
        }

        .card:hover{
            transform:translateY(-3px);
            transition:.3s;
        }

        .stat-card{
            text-align:center;
            padding:20px;
        }

        .stat-value{
            font-size:34px;
            font-weight:bold;
        }

        .table thead{
            background:linear-gradient(135deg,#0d6efd,#4f46e5);
            color:white;
        }

        .table thead th{
            border:none;
            text-align:center;
        }

        .table tbody td{
            text-align:center;
            vertical-align:middle;
        }

        .table tbody tr:hover{
            background:#eef5ff;
        }

    </style>

</head>

<body>

<div class="container py-4">

    <!-- Header -->

    <div class="header">

        <div class="d-flex justify-content-between align-items-center">

            <div>

                <h2>

                    <i class="bi bi-rocket-takeoff-fill"></i>

                    Sprint Dashboard

                </h2>

                <p class="mb-0">

                    Sprint Progress & Delivery Metrics

                </p>

            </div>

            <span class="badge bg-light text-dark fs-6">

                Agile Metrics

            </span>

        </div>

    </div>

    <!-- Back -->

    <div class="mb-4">

        <a th:href="@{/user}"
           class="btn btn-secondary">

            <i class="bi bi-arrow-left"></i>

            Back To Dashboard

        </a>

    </div>

    <!-- Summary -->

    <div class="row mb-4">

        <div class="col-md-4">

            <div class="card stat-card">

                <h6>Total Sprints</h6>

                <div class="stat-value text-primary"
                     th:text="${totalSprints}">
                    0
                </div>

            </div>

        </div>

    </div>

    <!-- Sprint Table -->

    <div class="card">

        <div class="card-body">

            <h4 class="mb-4">

                Sprint Details

            </h4>

            <div class="table-responsive">

                <table class="table table-hover">

                    <thead>

                    <tr>

                        <th>Sprint Name</th>

                        <th>Planned SP</th>

                        <th>Completed SP</th>

                        <th>Planned Stories</th>

                        <th>Completed Stories</th>

                        <th>Completion %</th>

                        <th>Status</th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="sprint : ${sprints}">

                        <td th:text="${sprint.sprintName}">
                        </td>

                        <td th:text="${sprint.plannedStoryPoints}">
                        </td>

                        <td th:text="${sprint.completedStoryPoints}">
                        </td>

                        <td th:text="${sprint.plannedStories}">
                        </td>

                        <td th:text="${sprint.completedStories}">
                        </td>

                        <td>

                            <span th:text="${sprint.plannedStoryPoints > 0 ?
                           #numbers.formatDecimal(
                           (sprint.completedStoryPoints * 100.0)
                           / sprint.plannedStoryPoints,
                           1,2) + '%' : '0%'}">

                            </span>

                        </td>

                        <td>

                            <span class="badge bg-success"
                                  th:if="${sprint.completedStoryPoints >= sprint.plannedStoryPoints}">

                                Completed

                            </span>

                            <span class="badge bg-warning text-dark"
                                  th:if="${sprint.completedStoryPoints < sprint.plannedStoryPoints}">

                                In Progress

                            </span>

                        </td>

                    </tr>

                    <tr th:if="${sprints == null or #lists.isEmpty(sprints)}">

                        <td colspan="7"
                            class="text-center">

                            No Sprint Data Available

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

</body>

</html>
