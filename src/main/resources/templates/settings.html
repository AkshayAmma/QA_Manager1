<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Account Settings</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{
            background:#f4f7fc;
            font-family:"Segoe UI",sans-serif;
        }

        .page-header{
            background:linear-gradient(135deg,#0d6efd,#4f46e5);
            color:white;
            padding:25px;
            border-radius:15px;
            margin-bottom:25px;
            box-shadow:0 4px 20px rgba(0,0,0,0.1);
        }

        .settings-card{
            border:none;
            border-radius:15px;
            box-shadow:0 4px 15px rgba(0,0,0,0.08);
        }

        .profile-avatar{
            width:100px;
            height:100px;
            border-radius:50%;
            background:#0d6efd;
            color:white;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:40px;
            font-weight:bold;
            margin:auto;
        }

        .form-label{
            font-weight:600;
        }

        .btn-save{
            background:#0d6efd;
            border:none;
            padding:10px 25px;
            border-radius:10px;
        }

        .btn-save:hover{
            background:#0b5ed7;
        }

        .badge-role{
            font-size:14px;
        }

    </style>

</head>

<body>

<div class="container py-4">

    <!-- Header -->

    <div class="page-header">

        <div class="d-flex justify-content-between align-items-center">

            <div>
                <h2>⚙️ Account Settings</h2>
                <p class="mb-0">
                    Manage your profile information
                </p>
            </div>

            <a th:href="@{/admin}"
               class="btn btn-light">
                ← Back to Dashboard
            </a>

        </div>

    </div>

    <!-- Settings Card -->

    <div class="card settings-card">

        <div class="card-body p-4">

            <!-- Profile Info -->

            <div class="text-center mb-4">

                <div class="profile-avatar">

                    <span th:text="${user != null and user.name != null ? #strings.substring(user.name,0,1) : 'A'}">
                        A
                    </span>

                </div>

                <h4 class="mt-3"
                    th:text="${user.name}">
                    User Name
                </h4>

                <span class="badge bg-primary badge-role"
                      th:text="${user.role}">
                    QA Manager
                </span>

            </div>

            <!-- Update Form -->

            <form th:action="@{/settings/update}"
                  th:object="${user}"
                  method="post">

                <!-- Hidden User ID -->

                <input type="hidden"
                       th:field="*{id}">

                <div class="row">

                    <!-- Full Name -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Full Name
                        </label>

                        <input type="text"
                               class="form-control"
                               th:field="*{name}"
                               required>

                    </div>

                    <!-- Email -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Email Address
                        </label>

                        <input type="email"
                               class="form-control"
                               th:field="*{email}"
                               required>

                    </div>

                </div>

                <div class="row">

                    <!-- Role -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Role
                        </label>

                        <input type="text"
                               class="form-control"
                               th:field="*{role}"
                               required>

                    </div>

                    <!-- Status -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Account Status
                        </label>

                        <input type="text"
                               class="form-control"
                               value="Active"
                               readonly>

                    </div>

                </div>

                <hr>

                <div class="d-flex justify-content-end">

                    <button type="submit"
                            class="btn btn-save text-white">
                        Save Changes
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
