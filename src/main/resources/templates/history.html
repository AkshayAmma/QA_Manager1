<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard History</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{
            background:#f4f7fc;
            font-family:"Segoe UI",sans-serif;
        }

        .dashboard-header{
            background:linear-gradient(135deg,#0d6efd,#4f46e5);
            color:white;
            padding:30px;
            border-radius:18px;
            margin-bottom:25px;
            box-shadow:0 5px 20px rgba(0,0,0,0.12);
        }

        .history-card{
            background:white;
            border:none;
            border-radius:18px;
            overflow:hidden;
            box-shadow:0 4px 15px rgba(0,0,0,0.08);
        }

        .table{
            margin-bottom:0;
        }

        .table thead{
            background:#0d6efd;
            color:white;
        }

        .table thead th{
            border:none;
            padding:16px;
            font-weight:600;
        }

        .table tbody td{
            vertical-align:middle;
            padding:16px;
        }

        .table-hover tbody tr:hover{
            background:#f8f9fa;
            transition:0.3s;
        }

        .page-title{
            margin:0;
        }

        .snapshot-count{
            background:white;
            color:#0d6efd;
            padding:10px 18px;
            border-radius:30px;
            font-weight:600;
        }

        .status-ready{
            background:#198754;
            color:white;
        }

        .status-risk{
            background:#ffc107;
            color:black;
        }

        .status-blocked{
            background:#dc3545;
            color:white;
        }

        .status-pill{
            padding:8px 14px;
            border-radius:20px;
            font-size:13px;
            font-weight:600;
        }

        .table-container{
            overflow-x:auto;
        }

        @media(max-width:768px){

            .dashboard-header{
                text-align:center;
            }

            .dashboard-header .d-flex{
                flex-direction:column;
                gap:15px;
            }

        }

    </style>

</head>

<body>

<div class="container-fluid p-4">

    <!-- Header -->

    <div class="dashboard-header">

        <div class="d-flex justify-content-between align-items-center">

            <div>
                <h2 class="page-title">
                    📚 Dashboard Snapshot History
                </h2>

                <p class="mb-0">
                    Historical sprint metrics and release snapshots.
                </p>
            </div>

            <div class="snapshot-count">
                Total Records:
                <span th:text="${#lists.size(history)}">0</span>
            </div>

        </div>

    </div>

    <!-- History Table -->

    <div class="history-card">

        <div class="table-container">

            <table class="table table-hover">

                <thead>

                <tr>
                    <th>🚀 Sprint</th>
                    <th>📊 Coverage %</th>
                    <th>🤖 Automation %</th>
                    <th>🐞 Defects</th>
                    <th>⚡ Velocity</th>
                    <th>✅ Release Status</th>
                </tr>

                </thead>

                <tbody>

                <tr th:each="h : ${history}">

                    <td th:text="${h.sprintName}">
                        Sprint 1
                    </td>

                    <td>
                        <span class="fw-semibold"
                              th:text="${h.coverage}">
                            0
                        </span>%
                    </td>

                    <td>
                        <span class="fw-semibold"
                              th:text="${h.automationCoverage}">
                            0
                        </span>%
                    </td>

                    <td th:text="${h.defects}">
                        0
                    </td>

                    <td th:text="${h.velocity}">
                        0
                    </td>

                    <td>

                        <span
                                class="status-pill"

                                th:classappend="
                            ${h.releaseStatus == 'READY'} ? ' status-ready' :
                            (${h.releaseStatus == 'AT RISK'} ? ' status-risk' :
                            ' status-blocked')"

                                th:text="${h.releaseStatus}">
                            READY
                        </span>

                    </td>

                </tr>

                <!-- Empty State -->

                <tr th:if="${#lists.isEmpty(history)}">
                    <td colspan="6" class="text-center text-muted p-5">
                        No dashboard snapshots available.
                    </td>
                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
