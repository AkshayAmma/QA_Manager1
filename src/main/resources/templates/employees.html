<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #4f46e5, #0d6efd, #06b6d4);
            font-family: "Segoe UI", sans-serif;
            padding: 40px 0;
        }

        .page-header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .page-header h1 {
            font-weight: 700;
            margin-bottom: 10px;
        }

        .page-header p {
            opacity: 0.9;
        }

        .main-card {
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.18);
            margin-bottom: 25px;
        }

        .section-title {
            color: #0d6efd;
            font-weight: 700;
            margin-bottom: 25px;
        }

        .form-label {
            font-weight: 600;
            color: #495057;
        }

        .form-control {
            border-radius: 12px;
            border: 1px solid #dbe4ff;
            padding: 12px;
        }

        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 12px rgba(13,110,253,0.25);
        }

        .btn-save {
            background: linear-gradient(45deg, #0d6efd, #2563eb);
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
            color: white;
        }

        .btn-save:hover {
            background: linear-gradient(45deg, #0b5ed7, #1d4ed8);
            color: white;
        }

        .employee-table-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 12px 35px rgba(0,0,0,0.18);
        }

        .table-header {
            background: linear-gradient(45deg, #0d6efd, #2563eb);
            color: white;
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .table-header h5 {
            margin: 0;
            font-weight: 600;
        }

        .search-box {
            max-width: 250px;
        }

        .table {
            margin-bottom: 0;
        }

        .table th {
            font-weight: 600;
            color: #495057;
        }

        .table tbody tr:hover {
            background-color: #f4f9ff;
            transition: 0.3s;
        }

        .action-btn {
            border-radius: 8px;
            padding: 6px 14px;
        }

        .btn-edit {
            background: #ffc107;
            color: black;
            border: none;
        }

        .btn-delete {
            background: #dc3545;
            color: white;
            border: none;
        }

        .empty-message {
            text-align: center;
            color: gray;
            padding: 25px;
        }

        .footer {
            text-align: center;
            color: white;
            margin-top: 20px;
            opacity: 0.9;
        }

        @media (max-width:768px) {

            .table-header {
                flex-direction: column;
                gap: 10px;
            }

            .main-card {
                padding: 25px;
            }

            .search-box {
                max-width: 100%;
            }
        }
    </style>

</head>

<body>

<div class="container">

    <div class="page-header">
        <h1>Employee Management System</h1>
        <p>Manage employees efficiently within QA Task Management</p>
    </div>

    <!-- Employee Form -->

    <div class="main-card">

        <h4 class="section-title">
            Add Employee
        </h4>

        <form th:action="@{/employees/save}"
              th:object="${employee}"
              method="post">

            <input type="hidden" th:field="*{id}">

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label class="form-label">Employee ID</label>
                    <input type="text"
                           th:field="*{employeeId}"
                           class="form-control"
                           placeholder="EMP001"
                           required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Employee Name</label>
                    <input type="text"
                           th:field="*{employeeName}"
                           class="form-control"
                           placeholder="John Doe"
                           required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email"
                           th:field="*{email}"
                           class="form-control"
                           placeholder="john@example.com"
                           required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Designation</label>
                    <input type="text"
                           th:field="*{designation}"
                           class="form-control"
                           placeholder="QA Engineer"
                           required>
                </div>

                <div class="col-md-12 mb-3">
                    <label class="form-label">Project Name</label>
                    <input type="text"
                           th:field="*{projectName}"
                           class="form-control"
                           placeholder="QA Task Management System"
                           required>
                </div>

            </div>

            <button type="submit"
                    class="btn btn-save w-100"
                    th:text="${employee.id == null} ?
                 'Save Employee' :
                 'Update Employee'">
                Save Employee
            </button>

        </form>

    </div>

    <!-- Employee Directory -->

    <div class="employee-table-card">

        <div class="table-header">

            <h5>Employee Directory</h5>

            <input type="text"
                   class="form-control search-box"
                   placeholder="Search Employee">

        </div>

        <div class="table-responsive">

            <table class="table table-hover align-middle">

                <thead>
                <tr>
                    <th>Employee ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Designation</th>
                    <th>Project</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="e : ${employees}">

                    <td th:text="${e.employeeId}"></td>

                    <td th:text="${e.employeeName}"></td>

                    <td th:text="${e.email}"></td>

                    <td th:text="${e.designation}"></td>

                    <td th:text="${e.projectName}"></td>

                    <td>

                        <a th:href="@{/employees/edit/{id}(id=${e.id})}"
                           class="btn btn-sm btn-edit action-btn">
                            Edit
                        </a>

                        <a th:href="@{/employees/delete/{id}(id=${e.id})}"
                           class="btn btn-sm btn-delete action-btn"
                           onclick="return confirm('Are you sure you want to delete this employee?')">
                            Delete
                        </a>

                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(employees)}">
                    <td colspan="6" class="empty-message">
                        No Employees Found
                    </td>
                </tr>

                </tbody>

            </table>

        </div>

    </div>

<!--    <div class="footer">-->
<!--        © 2026 QA Task Management System-->
<!--    </div>-->

</div>

</body>
</html>
