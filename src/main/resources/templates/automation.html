<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Automation Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{
            background:#f4f7fc;
            font-family:"Segoe UI",sans-serif;
        }

        .dashboard-header{
            background:linear-gradient(135deg,#0d6efd,#4f46e5);
            color:white;
            padding:25px;
            border-radius:15px;
            margin-bottom:25px;
            box-shadow:0 4px 20px rgba(0,0,0,0.1);
        }

        .metric-card{
            border:none;
            border-radius:15px;
            background:white;
            box-shadow:0 4px 15px rgba(0,0,0,0.08);
            transition:0.3s;
        }

        .metric-card:hover{
            transform:translateY(-5px);
        }

        .metric-title{
            color:#6c757d;
            font-size:14px;
            margin-bottom:10px;
        }

        .metric-value{
            font-size:32px;
            font-weight:bold;
        }

        .success-text{
            color:#198754;
        }

        .danger-text{
            color:#dc3545;
        }

        .info-text{
            color:#0d6efd;
        }

        .summary-card{
            background:white;
            border-radius:15px;
            padding:20px;
            margin-top:25px;
            box-shadow:0 4px 15px rgba(0,0,0,0.08);
        }

    </style>

</head>

<body>

<div class="container-fluid p-4">

    <!-- Header -->

    <div class="dashboard-header">

        <div class="d-flex justify-content-between align-items-center">

            <div>
                <h2>🤖 Automation Dashboard</h2>
                <p class="mb-0">
                    Automation Testing Metrics Overview
                </p>
            </div>

            <a th:href="@{/admin}"
               class="btn btn-light">
                Back to Dashboard
            </a>

        </div>

    </div>

    <!-- Row 1 -->

    <div class="row g-4">

        <div class="col-md-4">

            <div class="card metric-card">

                <div class="card-body">

                    <div class="metric-title">
                        Automation Coverage %
                    </div>

                    <div class="metric-value info-text"
                         th:text="${#numbers.formatDecimal(automationMetrics.automationCoverage,1,2)} + '%'">
                        80.00%
                    </div>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card metric-card">

                <div class="card-body">

                    <div class="metric-title">
                        API Automation Coverage %
                    </div>

                    <div class="metric-value info-text"
                         th:text="${#numbers.formatDecimal(automationMetrics.apiAutomationCoverage,1,2)} + '%'">
                        75.00%
                    </div>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card metric-card">

                <div class="card-body">

                    <div class="metric-title">
                        Automation Leverage %
                    </div>

                    <div class="metric-value info-text"
                         th:text="${#numbers.formatDecimal(automationMetrics.automationLeverage,1,2)} + '%'">
                        80.00%
                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- Row 2 -->

    <div class="row g-4 mt-1">

        <div class="col-md-6">

            <div class="card metric-card">

                <div class="card-body">

                    <div class="metric-title">
                        Pass Rate %
                    </div>

                    <div class="metric-value success-text"
                         th:text="${#numbers.formatDecimal(automationMetrics.passRate,1,2)} + '%'">
                        93.75%
                    </div>

                </div>

            </div>

        </div>

        <div class="col-md-6">

            <div class="card metric-card">

                <div class="card-body">

                    <div class="metric-title">
                        Failure Rate %
                    </div>

                    <div class="metric-value danger-text"
                         th:text="${#numbers.formatDecimal(automationMetrics.failureRate,1,2)} + '%'">
                        6.25%
                    </div>

                </div>

            </div>

        </div>

    </div>
