<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Task Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #4f46e5, #0d6efd, #06b6d4);
            font-family: "Segoe UI", sans-serif;
            padding: 40px 0;
        }

        .page-header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .page-header h1 {
            font-weight: 700;
            margin-bottom: 10px;
        }

        .page-header p {
            opacity: 0.9;
        }

        .main-card {
            background: #fff;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.18);
            margin-bottom: 30px;
        }

        .section-title {
            color: #0d6efd;
            font-weight: 700;
            margin-bottom: 25px;
        }

        .form-label {
            font-weight: 600;
            color: #495057;
        }

        .form-control,
        .form-select {
            border-radius: 12px;
            padding: 12px;
            border: 1px solid #dbe4ff;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 12px rgba(13, 110, 253, 0.25);
        }

        .btn-save {
            background: linear-gradient(45deg, #0d6efd, #2563eb);
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
            color: white;
        }

        .btn-save:hover {
            background: linear-gradient(45deg, #0b5ed7, #1d4ed8);
            color: white;
        }

        .task-table-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 12px 35px rgba(0,0,0,0.18);
        }

        .table-header {
            background: linear-gradient(45deg, #0d6efd, #2563eb);
            color: white;
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .table-header h5 {
            margin: 0;
            font-weight: 600;
        }

        .search-box {
            max-width: 250px;
        }

        .table {
            margin-bottom: 0;
        }

        .table thead {
            background: #f8f9fa;
        }

        .table tbody tr:hover {
            background-color: #f5f9ff;
            transition: 0.3s;
        }

        .badge-status {
            background: #0d6efd;
            color: white;
            padding: 6px 10px;
            border-radius: 8px;
        }

        .action-btn {
            border-radius: 8px;
            padding: 6px 14px;
            font-size: 14px;
        }

        .btn-edit {
            background: #ffc107;
            border: none;
        }

        .btn-delete {
            background: #dc3545;
            color: white;
            border: none;
        }

        .footer {
            text-align: center;
            color: white;
            margin-top: 20px;
            opacity: 0.9;
        }

        .empty-message {
            text-align: center;
            padding: 25px;
            color: gray;
        }

        @media(max-width:768px) {
            .table-header {
                flex-direction: column;
                gap: 10px;
            }

            .main-card {
                padding: 25px;
            }
        }
    </style>

</head>

<body>

<div class="container">

    <div class="page-header">
        <h1>Daily Task Management</h1>
        <p>Track QA execution progress and daily testing activities</p>
    </div>

    <div class="main-card">

        <h4 class="section-title">
            Daily Task Entry
        </h4>

        <form th:action="@{/tasks/save}" method="post">

            <div class="row">

                <div class="col-md-4 mb-3">
                    <label class="form-label">Employee ID</label>
                    <input type="text"
                           name="employeeId"
                           class="form-control"
                           placeholder="EMP001"
                           required>
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">User Story</label>
                    <input type="text"
                           name="storyId"
                           class="form-control"
                           placeholder="US-101"
                           required>
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">Task Date</label>
                    <input type="date"
                           name="taskDate"
                           class="form-control"
                           required>
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">Hours Worked</label>
                    <input type="number"
                           step="0.5"
                           name="hoursWorked"
                           class="form-control"
                           placeholder="8"
                           required>
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">Executed Test Cases</label>
                    <input type="number"
                           name="testCasesExecuted"
                           class="form-control"
                           placeholder="25">
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">Defects Raised</label>
                    <input type="number"
                           name="defectsRaised"
                           class="form-control"
                           placeholder="3">
                </div>

                <div class="col-12 mb-3">
                    <label class="form-label">Remarks</label>
                    <textarea class="form-control"
                              name="remarks"
                              rows="4"
                              placeholder="Enter comments, blockers, or testing updates"></textarea>
                </div>

            </div>

            <div class="text-center mt-3">
                <button type="submit"
                        class="btn btn-save w-100">
                    Save Task
                </button>
            </div>

        </form>

    </div>

    <div class="task-table-card">

        <div class="table-header">
            <h5>Daily Task Records</h5>

            <input type="text"
                   class="form-control search-box"
                   placeholder="Search Tasks">
        </div>

        <div class="table-responsive">

            <table class="table table-hover align-middle">

                <thead>
                <tr>
                    <th>Employee</th>
                    <th>Story</th>
                    <th>Date</th>
                    <th>Hours</th>
                    <th>Executed</th>
                    <th>Defects</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="task : ${tasks}">

                    <td th:text="${task.employeeId}"></td>

                    <td th:text="${task.storyId}"></td>

                    <td th:text="${task.taskDate}"></td>

                    <td th:text="${task.hoursWorked}"></td>

                    <td>
                        <span class="badge-status"
                              th:text="${task.testCasesExecuted}">
                        </span>
                    </td>

                    <td th:text="${task.defectsRaised}"></td>

                    <td>

                        <a th:href="@{/tasks/edit/{id}(id=${task.id})}"
                           class="btn btn-sm btn-edit action-btn">
                            Edit
                        </a>

                        <a th:href="@{/tasks/delete/{id}(id=${task.id})}"
                           class="btn btn-sm btn-delete action-btn"
                           onclick="return confirm('Are you sure you want to delete this task?')">
                            Delete
                        </a>

                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(tasks)}">
                    <td colspan="7" class="empty-message">
                        No Daily Tasks Available
                    </td>
                </tr>

                </tbody>

            </table>

        </div>

    </div>

    <div class="footer">
        © 2026 QA Task Management System
    </div>

</div>

</body>
</html>
