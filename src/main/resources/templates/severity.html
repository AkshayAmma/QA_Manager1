<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Severity Distribution Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {
            background: #f4f7fc;
            font-family: "Segoe UI", sans-serif;
        }

        .dashboard-header {
            background: linear-gradient(135deg, #dc3545, #fd7e14);
            color: white;
            padding: 30px;
            border-radius: 18px;
            margin-bottom: 25px;
            box-shadow: 0px 5px 20px rgba(0,0,0,0.12);
        }

        .severity-card {
            background: #fff;
            border: none;
            border-radius: 18px;
            padding: 5px;
            transition: all 0.3s ease;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.08);
            height: 100%;
        }

        .severity-card:hover {
            transform: translateY(-6px);
            box-shadow: 0px 10px 25px rgba(0,0,0,0.15);
        }

        .severity-card .card-body {
            padding: 25px;
        }

        .severity-title {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #6c757d;
            margin-bottom: 10px;
        }

        .severity-count {
            font-size: 42px;
            font-weight: 700;
        }

        .severity-icon {
            font-size: 30px;
            float: right;
        }

        .critical {
            border-left: 6px solid #dc3545;
        }

        .critical .severity-count,
        .critical .severity-icon {
            color: #dc3545;
        }

        .high {
            border-left: 6px solid #fd7e14;
        }

        .high .severity-count,
        .high .severity-icon {
            color: #fd7e14;
        }

        .medium {
            border-left: 6px solid #0dcaf0;
        }

        .medium .severity-count,
        .medium .severity-icon {
            color: #0dcaf0;
        }

        .low {
            border-left: 6px solid #198754;
        }

        .low .severity-count,
        .low .severity-icon {
            color: #198754;
        }

        .summary-card {
            margin-top: 30px;
            background: white;
            border-radius: 18px;
            border: none;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.08);
        }

        .summary-header {
            background: linear-gradient(135deg, #0d6efd, #4f46e5);
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: 600;
            border-radius: 18px 18px 0 0;
        }

        .summary-body {
            padding: 35px;
            text-align: center;
        }

        .total-defects {
            font-size: 54px;
            font-weight: bold;
            color: #212529;
        }

        .section-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
        }

        @media(max-width:768px) {

            .dashboard-header {
                text-align: center;
            }

            .severity-count {
                font-size: 30px;
            }

            .total-defects {
                font-size: 40px;
            }
        }

    </style>

</head>

<body>

<div class="container-fluid p-4">

    <!-- Header -->

    <div class="dashboard-header">

        <div class="d-flex justify-content-between align-items-center">

            <div>
                <h2>🐞 Severity Distribution Dashboard</h2>
                <p class="mb-0">
                    Monitor defect severity levels across the project.
                </p>
            </div>

            <span class="badge bg-light text-dark fs-6">
                Defect Analytics
            </span>

        </div>

    </div>

    <div class="section-title">
        Defect Severity Breakdown
    </div>

    <div class="row g-4">

        <!-- Critical -->

        <div class="col-lg-3 col-md-6">
            <div class="severity-card critical">
                <div class="card-body">

                    <div class="severity-icon">
                        🔥
                    </div>

                    <div class="severity-title">
                        Critical
                    </div>

                    <div class="severity-count"
                         th:text="${severity.critical}">
                        0
                    </div>

                </div>
            </div>
        </div>

        <!-- High -->

        <div class="col-lg-3 col-md-6">
            <div class="severity-card high">
                <div class="card-body">

                    <div class="severity-icon">
                        ⚠️
                    </div>

                    <div class="severity-title">
                        High
                    </div>

                    <div class="severity-count"
                         th:text="${severity.high}">
                        0
                    </div>

                </div>
            </div>
        </div>

        <!-- Medium -->

        <div class="col-lg-3 col-md-6">
            <div class="severity-card medium">
                <div class="card-body">

                    <div class="severity-icon">
                        📋
                    </div>

                    <div class="severity-title">
                        Medium
                    </div>

                    <div class="severity-count"
                         th:text="${severity.medium}">
                        0
                    </div>

                </div>
            </div>
        </div>

        <!-- Low -->

        <div class="col-lg-3 col-md-6">
            <div class="severity-card low">
                <div class="card-body">

                    <div class="severity-icon">
                        ✅
                    </div>

                    <div class="severity-title">
                        Low
                    </div>

                    <div class="severity-count"
                         th:text="${severity.low}">
                        0
                    </div>

                </div>
            </div>
        </div>

    </div>

    <!-- Summary -->

    <div class="card summary-card">

        <div class="summary-header">
            TOTAL DEFECTS
        </div>

        <div class="summary-body">

            <div class="total-defects"
                 th:text="${severity.critical + severity.high + severity.medium + severity.low}">
                0
            </div>

            <p class="text-muted mt-2">
                Total defects reported across all severity levels
            </p>

        </div>

    </div>

</div>

</body>
</html>
