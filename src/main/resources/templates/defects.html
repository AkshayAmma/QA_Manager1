<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Defect Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            min-height:100vh;
            background:linear-gradient(135deg,#4f46e5,#0d6efd,#06b6d4);
            font-family:"Segoe UI",sans-serif;
            padding:40px 0;
        }

        .page-header{
            text-align:center;
            color:white;
            margin-bottom:30px;
        }

        .page-header h1{
            font-weight:700;
        }

        .main-card{
            background:white;
            border-radius:20px;
            padding:35px;
            margin-bottom:25px;
            box-shadow:0 12px 35px rgba(0,0,0,0.15);
        }

        .section-title{
            color:#0d6efd;
            font-weight:700;
            margin-bottom:25px;
        }

        .form-label{
            font-weight:600;
        }

        .form-control,
        .form-select{
            border-radius:12px;
            padding:12px;
        }

        .form-control:focus,
        .form-select:focus{
            border-color:#0d6efd;
            box-shadow:0 0 10px rgba(13,110,253,0.25);
        }

        .btn-save{
            background:#dc3545;
            border:none;
            border-radius:12px;
            padding:12px;
            font-weight:600;
        }

        .btn-save:hover{
            background:#bb2d3b;
        }

        .table-card{
            background:white;
            border-radius:20px;
            overflow:hidden;
            box-shadow:0 12px 35px rgba(0,0,0,0.15);
        }

        .table-header{
            background:linear-gradient(45deg,#0d6efd,#2563eb);
            color:white;
            padding:18px 25px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .search-box{
            max-width:250px;
        }

        .table{
            margin-bottom:0;
        }

        .table tbody tr:hover{
            background:#f5f9ff;
        }

        .badge-critical{
            background:#dc3545;
        }

        .badge-high{
            background:#fd7e14;
        }

        .badge-medium{
            background:#ffc107;
            color:black;
        }

        .badge-low{
            background:#198754;
        }

        .action-btn{
            border-radius:8px;
            padding:6px 12px;
        }

        .footer{
            text-align:center;
            color:white;
            margin-top:20px;
            opacity:.9;
        }

        @media(max-width:768px){

            .table-header{
                flex-direction:column;
                gap:10px;
            }

            .search-box{
                max-width:100%;
            }

            .main-card{
                padding:25px;
            }
        }

    </style>

</head>

<body>

<div class="container">

    <!-- Header -->

    <div class="page-header">
        <h1>Defect Management</h1>
        <p>Track and manage QA defects effectively</p>
    </div>

    <!-- Defect Form -->

    <div class="main-card">

        <h4 class="section-title">
            Report New Defect
        </h4>

        <form th:action="@{/defects/save}"
              th:object="${defect}"
              method="post">

            <input type="hidden"
                   th:field="*{id}">

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label class="form-label">
                        Defect ID
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{defectId}"
                           placeholder="BUG-001"
                           required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">
                        Story ID
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{storyId}"
                           placeholder="US-101"
                           required>
                </div>

                <div class="col-md-12 mb-3">
                    <label class="form-label">
                        Summary
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{summary}"
                           placeholder="Login page crashes after successful authentication"
                           required>
                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Severity
                    </label>

                    <select class="form-select"
                            th:field="*{severity}"
                            required>

                        <option value="">
                            Select Severity
                        </option>

                        <option value="Critical">
                            Critical
                        </option>

                        <option value="High">
                            High
                        </option>

                        <option value="Medium">
                            Medium
                        </option>

                        <option value="Low">
                            Low
                        </option>

                    </select>

                </div>

            </div>

            <button type="submit"
                    class="btn btn-save w-100"
                    th:text="${defect.id == null}
                    ? 'Save Defect'
                    : 'Update Defect'">

                Save Defect

            </button>

        </form>

    </div>

    <!-- Defect Table -->

    <div class="table-card">

        <div class="table-header">

            <h5>
                Defect Repository
            </h5>

            <input type="text"
                   class="form-control search-box"
                   placeholder="Search Defects">

        </div>

        <div class="table-responsive">

            <table class="table table-hover align-middle">

                <thead>
                <tr>
                    <th>Defect ID</th>
                    <th>Story ID</th>
                    <th>Summary</th>
                    <th>Severity</th>
                    <th width="180">Actions</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="d : ${defects}">

                    <td th:text="${d.defectId}"></td>

                    <td th:text="${d.storyId}"></td>

                    <td th:text="${d.summary}"></td>

                    <td>

                            <span th:if="${d.severity == 'Critical'}"
                                  class="badge badge-critical">
                                Critical
                            </span>

                        <span th:if="${d.severity == 'High'}"
                              class="badge badge-high">
                                High
                            </span>

                        <span th:if="${d.severity == 'Medium'}"
                              class="badge badge-medium">
                                Medium
                            </span>

                        <span th:if="${d.severity == 'Low'}"
                              class="badge badge-low">
                                Low
                            </span>

                    </td>

                    <td>

                        <a th:href="@{/defects/edit/{id}(id=${d.id})}"
                           class="btn btn-warning btn-sm action-btn">
                            Edit
                        </a>

                        <a th:href="@{/defects/delete/{id}(id=${d.id})}"
                           class="btn btn-danger btn-sm action-btn"
                           onclick="return confirm('Are you sure you want to delete this defect?')">
                            Delete
                        </a>

                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(defects)}">
                    <td colspan="5" class="text-center p-4">
                        No Defects Found
                    </td>
                </tr>

                </tbody>

            </table>

        </div>

    </div>

<!--    <div class="footer">-->
<!--        © 2026 QA Task Management System-->
<!--    </div>-->

</div>

</body>
</html>
